packages:
  brews:
    - atuin
    - bat
    - carapace
    - chezmoi
    - direnv
    - eza
    - fastfetch
    - fd
    - fish
    - gh
    - git
    - go
    - gum
    - jj
    - jq
    - mise
    - neovim
    - node@20
    - prettier
    - ripgrep
    - rust
    - starship
    - stylua
    # Used directly by nvim-treesitter, not just as a neovim dependency.
    - tree-sitter
    - umputun/apps/revdiff
  casks:
    - 1password-cli
  # Omits git (from the distro) and mise (installs itself). neovim@latest is
  # nightly, hence @stable. eza and revdiff come from releases via ubi.
  mise:
    core:
      - atuin@latest
      - bat@latest
      - carapace@latest
      - chezmoi@latest
      - direnv@latest
      - fastfetch@latest
      - fd@latest
      - gh@latest
      - go@latest
      - gum@latest
      - jj@latest
      - jq@latest
      - neovim@stable
      - node@latest
      - npm:prettier@latest
      - ripgrep@latest
      - starship@latest
      - stylua@latest
      - tree-sitter@latest
      - ubi:eza-community/eza@latest
      - ubi:umputun/revdiff@latest
    gui:
      - rust@latest
