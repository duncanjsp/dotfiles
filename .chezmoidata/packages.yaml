packages:
  # macOS: Homebrew. Both Macs in this fleet are desktops, so there is no
  # headless variant to split out.
  #
  # tree-sitter and node@20 arrive as dependencies of neovim and of other
  # formulae respectively, but both are used directly — nvim-treesitter shells
  # out to the tree-sitter CLI, and .zshrc puts node@20 on PATH — so they are
  # declared rather than left to chance. Relying on a transitive dependency is
  # what let ripgrep go undeclared until a server exposed it.
  brews:
    - atuin
    - bat
    - carapace
    - direnv
    - eza
    - fastfetch
    - fd
    - git
    - gum
    - herdr
    - jandedobbeleer/oh-my-posh/oh-my-posh
    - jj
    - mise
    - neovim
    - node@20
    - prettier
    - ripgrep
    - stylua
    - tree-sitter
    - umputun/apps/revdiff
  # Linux: mise. User-local, needs no sudo, and behaves identically on
  # Debian-based and immutable distros — which is why desktops and servers share
  # it rather than splitting on the distro's package manager.
  #
  # Omits git (comes from the distro) and mise (installs itself).
  # neovim@latest resolves to nightly, hence the explicit @stable.
  # eza and revdiff are absent from mise's registry but publish Linux binaries
  # on GitHub, so they come from releases via ubi. (revdiff's Homebrew tap ships
  # no bottles, which is a fact about the tap, not about the project.)
  mise:
    core:
      - atuin@latest
      - bat@latest
      - carapace@latest
      - direnv@latest
      - fastfetch@latest
      - fd@latest
      - gum@latest
      - jj@latest
      - neovim@stable
      - node@latest
      - npm:prettier@latest
      - oh-my-posh@latest
      - ripgrep@latest
      - stylua@latest
      - tree-sitter@latest
      - ubi:eza-community/eza@latest
      - ubi:umputun/revdiff@latest
    # Desktops only: herdr is a terminal-multiplexer workflow that only makes
    # sense where a terminal emulator is running.
    gui:
      - herdr@latest
