theme: catppuccin-mocha

themes:
  catppuccin-mocha:
    ghostty: Catppuccin Mocha
    bat: Catppuccin Mocha
    zed:
      name: Catppuccin Mocha
      extension: catppuccin
    nvim:
      plugin: catppuccin/nvim
      # lazy.nvim names plugins after the repo, which here is just "nvim".
      lazy_name: catppuccin
      module: catppuccin
      colorscheme: catppuccin
      flavour: mocha
    palette:
      fg_plain: "#cdd6f4" # text
      accent: "#cba6f7" # mauve
      remote: "#89dceb" # sky
      path: "#89b4fa" # blue
      ok: "#a6e3a1" # green
      warn: "#fab387" # peach
      error: "#f38ba8" # red
      info: "#74c7ec" # sapphire

  dracula-pro:
    # Dracula Pro is paid: Ghostty and Zed use vendored theme files, the rest
    # use free Dracula.
    ghostty: dracula-pro
    bat: Dracula
    zed:
      name: Dracula Pro
      extension: ""
    nvim:
      plugin: Mofiqul/dracula.nvim
      lazy_name: dracula.nvim
      module: dracula
      colorscheme: dracula
      flavour: ""
    palette:
      fg_plain: "#E0DEF4"
      accent: "#F3AE35"
      remote: "#4B95E9"
      path: "#F07623"
      ok: "#59C9A5"
      warn: "#F3AE35"
      error: "#D81E5B"
      info: "#80FFEA"
